# Xcode project definition. Regenerate the .xcodeproj with:
#   cd ios && xcodegen generate
#
# The generated .xcodeproj is committed too, so the project opens in Xcode on a
# machine that has never heard of XcodeGen. Edit THIS file, not the project.

name: DailyWorkout

options:
  bundleIdPrefix: com.petergetcreo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  DailyWorkout:
    type: application
    platform: iOS

    sources:
      - path: DailyWorkout
        excludes:
          - Bridge.js
      # Injected into the page at document start, so it ships as a resource
      # rather than being compiled.
      - path: DailyWorkout/Bridge.js
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.petergetcreo.dailyworkout
        PRODUCT_NAME: Daily
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO    # the web-bundling phase reads ../
        # DEVELOPMENT_TEAM is intentionally unset — set it in Xcode once, under
        # Signing & Capabilities, after the Developer Program enrollment lands.

    info:
      path: DailyWorkout/Info.plist
      properties:
        CFBundleDisplayName: Daily
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false

    postCompileScripts:
      # The web app is the source of truth and lives at the repo root. Copy it
      # into the bundle at build time rather than keeping a second copy in the
      # iOS folder, so the two can never drift.
      #
      # sw.js is deliberately NOT bundled: service workers do not run on a
      # custom URL scheme, and there is nothing for one to do when every asset
      # is already local.
      - name: Bundle web app
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="$SRCROOT/.."
          DEST="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web"
          rm -rf "$DEST"
          mkdir -p "$DEST/icons"
          for f in index.html style.css app.js engine.js exercises.js manifest.json; do
            cp "$SRC/$f" "$DEST/$f"
          done
          cp "$SRC"/icons/*.png "$DEST/icons/"
          echo "bundled web app -> $DEST"
